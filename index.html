<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Country Hills dashboard theme - taken from the supplied reference dashboard (charcoal header, gold accent, Cairo/Tajawal, white panels). */
:root{
  --bg:#EEF2F5; --paper:#EEF2F5; --card:#FFFFFF; --ink:#152232; --muted:#5B6B7B; --line:#E1E8ED; --soft:#F6F9FA;
  --black:#2a2f3a; --ch1:#16181c; --ch2:#1f2228; --cream:#f3ece0;
  --gold:#b8862f; --gold-d:#9c6b1f; --gold-l:#f6ecd8; --goldline:#e7d6b0;
  --good:#137a52; --goodbg:#e3f3ea; --bad:#b23b39; --badbg:#fbe7e6; --warn:#8a5a12; --info:#3a5a86; --infobg:#e6edf6;
  --radius:14px; --shadow:0 1px 2px rgba(20,40,60,.06),0 6px 18px rgba(20,40,60,.05);
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif; --font-h:"Tajawal","Cairo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
h1,h2,h3{font-family:var(--font-h);margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 18px}
.mini{font-size:12px;color:var(--muted)}
/* header */
header{background:radial-gradient(900px 300px at 85% -40%,rgba(184,134,47,.16),transparent 60%),linear-gradient(120deg,var(--ch1),var(--ch2) 60%,#191b1f);color:var(--cream);padding:20px 0 22px;position:relative;overflow:hidden;border-bottom:3px solid var(--gold)}
header:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 220px at 10% 140%,rgba(184,134,47,.10),transparent 60%)}
header .wrap{position:relative;z-index:2}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:18px}
.logo{height:76px;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.htitle{font-size:24px;font-weight:800;letter-spacing:.2px;color:var(--cream);line-height:1.2}
.htitle b{color:var(--gold)}
.hsub{color:#c9bda6;font-size:13px;margin-top:6px}
.hsub .en{font-family:var(--font-h);letter-spacing:1.5px;font-size:11px;color:var(--gold);font-weight:700}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s;background:#fff;color:var(--black);border:1px solid var(--line)}
.btn:hover{filter:brightness(.97)}
.btn-gold,.btn.pri{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}.btn-gold:hover,.btn.pri:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn.dark{background:var(--black);color:#fff;border-color:var(--black)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
/* page nav */
.pagenav{background:var(--ch2);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:40}
.pgtabs{display:flex;gap:2px;overflow-x:auto}
.pgtabs button{padding:12px 16px;background:transparent;border:0;border-bottom:3px solid transparent;color:#c9bda6;font-family:var(--font-h);font-weight:800;font-size:14px;white-space:nowrap;transition:.15s;display:flex;gap:7px;align-items:center}
.pgtabs button:hover{color:var(--cream)}
.pgtabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
/* filter panel */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:18px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters .ms>button,.filters .sel{min-width:150px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chip{background:var(--gold-l);color:var(--gold-d);border:1px solid var(--goldline);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:800}
.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;font-size:12px;color:inherit}
.chip button:hover{background:var(--gold-d);color:#fff}
.chip.static{padding-right:12px;background:#fff;color:var(--muted);border-color:var(--line)}
/* content */
#content{padding-top:2px}
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 12px}
.page-head h2{font-size:20px;font-weight:800;display:flex;gap:10px;align-items:center}
.page-head h2:before{content:"";width:6px;height:22px;border-radius:3px;background:var(--gold)}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:900px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.span2{grid-column:span 2}
@media(max-width:1000px){.span2{grid-column:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:16px;font-weight:800;display:flex;gap:9px;align-items:center}
.card h3:before{content:"";width:5px;height:17px;border-radius:3px;background:var(--gold);flex:none}
.card .hint{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.card-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.card-head .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);background:var(--soft);white-space:nowrap}
.tag.ign{background:#fdf0d8;border-color:#ecd5a2;color:var(--warn)}
/* KPI */
.kpi{position:relative;overflow:hidden;padding:15px 16px 18px}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.kpi:nth-child(5n+2):after{background:var(--info)}.kpi:nth-child(5n+3):after{background:var(--good)}.kpi:nth-child(5n+4):after{background:#7b4fa3}.kpi:nth-child(5n+5):after{background:var(--black)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font-family:var(--font-h);font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:12px;color:var(--muted);font-family:var(--font);font-weight:700;margin-left:4px;letter-spacing:0}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.delta{font-weight:800;font-size:12px}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}.delta.flat{color:var(--muted)}
.info{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--soft);color:var(--muted);align-items:center;justify-content:center;font-size:10.5px;font-weight:800;cursor:help;flex:none;border:1px solid var(--line)}
.info:hover{background:var(--black);color:#fff}
/* tables */
.tbl-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{background:#f6f9fa;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none;z-index:1;border-bottom:1px solid var(--line)}
table.t th:hover{color:var(--black)}
table.t th.num,table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-h)}
table.t th .arr{margin-left:3px;font-size:10px;color:var(--gold-d)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.wrap{white-space:normal;min-width:220px;max-width:430px}
table.t tbody tr:hover td{background:#f3f8f7}
table.t tr.click{cursor:pointer}
table.t tr.tot td{background:var(--gold-l);font-weight:800;border-top:2px solid var(--gold)}
table.t tr.sel td{background:var(--gold-l);font-weight:700}
.tbl-tools{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.tbl-tools input[type=search],.inp,.sel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
.tbl-tools input[type=search]{min-width:230px}
.sel:focus,.inp:focus,.tbl-tools input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:12px;font-weight:800;margin-right:3px}
.badge.w{background:#fff3cd;color:#664d03}.badge.b{background:var(--badbg);color:var(--bad)}.badge.i{background:var(--infobg);color:var(--info)}.badge.g{background:var(--goodbg);color:var(--good)}
/* dropdowns */
.ms{position:relative}
.ms>button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;display:flex;gap:8px;align-items:center;min-width:130px;justify-content:space-between;font-size:13px}
.ms>button:hover,.ms.open>button{border-color:var(--gold)}
.ms>button .lab{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.ms>button .val{font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ms.active>button{background:var(--gold-l);border-color:var(--goldline)}
.ms .pop{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(20,40,60,.22);width:270px;max-height:350px;display:none;flex-direction:column;z-index:60}
.ms.open .pop{display:flex}.ms.right .pop{left:auto;right:0}
.ms .pop .srch{padding:8px;border-bottom:1px solid var(--line)}
.ms .pop input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit}
.ms .pop .acts{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ms .pop .opts{overflow:auto;padding:4px 0}
.ms .pop label{display:flex;gap:8px;align-items:center;padding:6px 12px;cursor:pointer}
.ms .pop label:hover{background:var(--gold-l)}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 14px;padding:12px 14px;background:linear-gradient(120deg,#fff,#faf6ee);border:1px solid #ecdcb8;border-radius:14px}
.filter-row .t{font-size:11px;font-weight:800;color:var(--gold-d);letter-spacing:.6px;text-transform:uppercase;margin-right:4px;align-self:center}
.filter-row label{font-size:11px;font-weight:700;color:var(--muted)}
/* charts */
.chart{width:100%;overflow:visible;max-width:780px;display:block}
.chart text{font-family:var(--font);fill:#33445a}
.bar{cursor:pointer;transition:opacity .12s}.bar:hover{opacity:.78}
.ax{stroke:#cfd8df;stroke-width:1}.grid-l{stroke:#e9eef2;stroke-width:1}
.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:100%}
.heat td,.heat th{padding:6px;text-align:center;white-space:nowrap}
.heat th{font-weight:700;color:var(--muted);background:none;position:static}
.heat td.lab{text-align:left;font-weight:700}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--soft);border-radius:10px;font-size:12.5px}
.note{background:var(--gold-l);border:1px solid var(--goldline);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#6b4d16;margin:0 0 14px}
.note.warn{background:#fdf0d8;border-color:#ecd5a2}.note.bad{background:var(--badbg);border-color:#efb9b7;color:#7a2321}
.insights{margin:0;padding:0;list-style:none}
.insights li{border-left:4px solid var(--gold);background:#faf7f0;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--ch1);color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;z-index:200;max-width:310px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);line-height:1.5}
#tip b{color:var(--gold)}
/* splash, modal, toast */
.splash{max-width:720px;margin:6vh auto;text-align:center}
.drop{border:2px dashed var(--goldline);background:#fff;border-radius:18px;padding:34px 24px;margin-top:18px}
.drop.over{background:var(--gold-l)}
.steps{text-align:left;margin:16px auto 0;max-width:560px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;z-index:300;background:var(--ch1);color:#fff;padding:11px 14px;border-radius:10px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:12.5px;border-bottom:3px solid var(--gold)}
.toast.err{background:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:780px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--black);color:#fff;border-color:var(--black)}
.ok{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}.wn{color:var(--warn);font-weight:800}
.foot{margin:28px 0 40px;text-align:center;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:3px}
.foot .dev{font-family:var(--font-h);font-weight:800;font-size:15px;color:var(--ink)}
.foot .dev:before,.foot .dev:after{content:"";display:inline-block;width:26px;height:3px;background:var(--gold);vertical-align:middle;margin:0 10px;border-radius:2px}
a{color:var(--gold-d);font-weight:700}
@media(max-width:640px){.logo{height:56px}.htitle{font-size:18px}}
@media print{header,.pagenav,.filters,.tbl-tools,.pager,.filter-row,.btn{display:none!important}}
.cmpbox{display:block}.cmpbox .sel{min-width:170px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:1/-1}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
.ms>button{text-align:left}.ms>button>span:first-child{display:block}
.logo{height:84px}

.gsbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px dashed #cdd6de;border-radius:12px;padding:10px 14px;margin-top:12px}
.gsbar .lbl{font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.gsbar input[type=url]{flex:1;min-width:240px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;direction:ltr}
.gsbar .chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.gsbar .btn{padding:8px 14px}

</style>
</head>

/* ===== FILTER STATE ===== */
const newEv = () => ({ types: new Set(), reasons: new Set(), creators: new Set(), approvers: new Set(), products: new Set(), wasted: new Set(), weekdays: new Set(), weeks: new Set(), dateFrom: '', dateTo: '', hourFrom: '', hourTo: '', search: '', flag: '' });

};
const GLOBAL_KEYS = ['years', 'quarters', 'months', 'branches'];
const FILTER_LABEL = { years: 'Year', quarters: 'Quarter', months: 'Month', branches: 'Branch', orderTypes: 'Order Type', categories: 'Category', payMethods: 'Payment Method', payGroups: 'Payment Group', discGroups: 'Discount Group', discLabels: 'Discount', ev: 'Event filters' };
const DS_FILTERS = { ot: ['orderTypes'], cat: ['categories'], pay: ['payMethods', 'payGroups'], dis: ['discGroups', 'discLabels'], vr: ['ev'] };
const evActive = () => { const e = F.ev; return e.types.size || e.reasons.size || e.creators.size || e.approvers.size || e.products.size || e.wasted.size || e.weekdays.size || e.weeks.size || e.dateFrom || e.dateTo || e.hourFrom !== '' || e.hourTo !== '' || e.search || e.flag; };

function selPeriods() { return DB.periods.filter(p => (!F.years.size || F.years.has(periodYear(p))) && (!F.quarters.size || F.quarters.has(periodQ(p))) && (!F.months.size || F.months.has(periodM(p)))); }
let CTX = null;
function makeCtx() { const P = new Set(selPeriods()); const B = F.branches.size ? new Set(F.branches) : new Set(DB.branches.map(b => b.ref)); CTX = { P, B, days: sum([...P], p => DB.periodInfo[p].days) }; return CTX; }
const inPB = (r, P = CTX.P, B = CTX.B) => P.has(r.Period) && B.has(r['Branch Reference']);

const fOT = (P = CTX.P, B = CTX.B, ot = true) => DB.ot.filter(r => inPB(r, P, B) && (!ot || !F.orderTypes.size || F.orderTypes.has(r['Order Type'])));

const fPay = (P = CTX.P, B = CTX.B) => DB.pay.filter(r => inPB(r, P, B) && (!F.payMethods.size || F.payMethods.has(r['Payment Method'])) && (!F.payGroups.size || F.payGroups.has(r.Group)));

function evMatch(r) {
  const e = F.ev;

  if (e.reasons.size && !e.reasons.has(r.reasonEN)) return false;
  if (e.creators.size && !e.creators.has(r['Order Creator'])) return false;
  if (e.approvers.size && !e.approvers.has(r['Approved By'] || '(none)')) return false;
  if (e.products.size && !e.products.has(r.Product)) return false;
  if (e.wasted.size && !e.wasted.has(r.wasted ? 'Yes' : 'No')) return false;
  if (e.weekdays.size && !e.weekdays.has(r.wd)) return false;

/* ===== KPI maths (all ratios from summed amounts, never averaged percentages) ===== */
function kOT(rows) {
  const k = { gross: sum(rows, 'Gross Sales'), grossEx: sum(rows, 'Gross Sales Without Tax'), net: sum(rows, 'Net Sales'), netTax: sum(rows, 'Net Sales With Tax'), taxes: sum(rows, 'Taxes'), disc: sum(rows, 'Discount Amount'), orders: sum(rows, 'Order Count'), guests: sum(rows, 'Guest Count'), qty: sum(rows, 'Net Quantity'), retAmt: sum(rows, 'Return Amount'), retQty: sum(rows, 'Return Quantity'), voidAmt: sum(rows, 'Void Amount'), voidQty: sum(rows, 'Void Quantity'), charges: sum(rows, 'Charges') };
  k.aov = div(k.net, k.orders); k.perGuest = div(k.net, k.guests); k.discRate = div(k.disc, k.grossEx); k.voidPct = div(k.voidAmt, k.gross); k.retPct = div(k.retAmt, k.gross);
  k.voidQtyRate = div(k.voidQty, k.qty); k.retQtyRate = div(k.retQty, k.qty);

}

  for (const b of DB.branches) { if (!B.has(b.ref)) continue; const rr = m.get(b.ref) || []; const k = kOT(rr); k.ref = b.ref; k.name = b.name; out.push(k); }
  return out;
}
function netRef(P) { return kOT(DB.ot.filter(r => P.has(r.Period) && (!F.orderTypes.size || F.orderTypes.has(r['Order Type'])))); }

/* comparison base periods */
function compareBase() {
  const m = F.compare.mode; if (m === 'none') return null; const sel = [...CTX.P]; if (!sel.length) return null;
  let base = [];
  if (m === 'prev') base = sel.map(p => shiftPeriod(p, -1)); else if (m === 'yoy') base = sel.map(p => shiftPeriod(p, -12)); else if (m === 'custom' && F.compare.period) base = [F.compare.period];
  base = [...new Set(base)];

  return { ok: true, P: new Set(have), label: (m === 'prev' ? 'vs previous month' : m === 'yoy' ? 'vs same month last year' : 'vs ' + periodLabel(have[0])), days: sum(have, p => DB.periodInfo[p].days) };
}

/* ===== CHARTS: dependency-free SVG chart helpers (return markup strings) ===== */
const PAL = ['#2a2f3a', '#b8862f', '#137a52', '#3a5a86', '#7b4fa3', '#c9731f', '#5b8c8c', '#8a6d3b', '#a23b72', '#6d8f3a', '#6D6A5C', '#9AA0A6'];

const bColor = ref => PAL[(DB.bIdx[ref] ?? 0) % PAL.length];
const TIP = (title, pairs) => [title, ...pairs.map(([a, b]) => b === undefined ? a : a + ': ' + b)].join('\n');
const niceMax = (v, int = false) => { if (!(v > 0)) return 1; const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]; const raw = v / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of steps) { const st = m * p; if (st * 4 >= v * 0.999 && (!int || (st >= 1 && Number.isInteger(st)))) return st * 4; } return 10 * p * 4; };

/* stacked horizontal bars. rows:[{label,key,parts:{series:value}}], series:[{k,label,color}] */
function stackH(rows, series, o = {}) {

/* line chart. series:[{name,color,points:[{x:label,y:value}]}], xs: ordered labels */

function singlePeriodNote() { return DB.periods.length < 2 ? `<div class="note"><b>${DB.periods.length} month loaded (${DB.periods.map(periodLabel).join(', ')}).</b> Trends, MoM, YoY and seasonality are not computable yet. They switch on automatically when further months are appended to the Backend.</div>` : ''; }
const brName = ref => DB.bName[ref] || ref;
function toggleBranch(ref) { F.branches = (F.branches.size === 1 && F.branches.has(ref)) ? new Set() : new Set([ref]); onFilterChange(true); }
function rateFlag(v, ref, mult) { return isNum(v) && isNum(ref) && ref > 0 && v >= mult * ref; }
function netSummary(P, B) { return { ot: kOT(fOT(P, B)), ref: netRef(P) }; }

/* ---- live review signals at branch level ---- */
function branchSignals() {
  const P = CTX.P, ref = netRef(P), all = new Set(DB.branches.map(b => b.ref)); const bk = branchKPIs(P, all);
  const out = []; const m = DB.settings;
  bk.forEach(k => {
    if (rateFlag(k.voidPct, ref.voidPct, +m['Review Multiple - Void Rate'])) out.push({ ref: k.ref, kind: 'void', text: `Void value ${fP(k.voidPct, 2)} of gross sales vs all branches ${fP(ref.voidPct, 2)} (${fX(k.voidPct / ref.voidPct)})` });
    if (rateFlag(k.retPct, ref.retPct, +m['Review Multiple - Return Rate'])) out.push({ ref: k.ref, kind: 'return', text: `Return value ${fP(k.retPct, 2)} of gross sales vs all branches ${fP(ref.retPct, 2)} (${fX(k.retPct / ref.retPct)})` });
    if (rateFlag(k.discRate, ref.discRate, +m['Review Multiple - Discount Rate'])) out.push({ ref: k.ref, kind: 'discount', text: `Discount rate ${fP(k.discRate, 2)} vs all branches ${fP(ref.discRate, 2)} (${fX(k.discRate / ref.discRate)})` });
  });
  return out;
}

/* =========================== 1. EXECUTIVE OVERVIEW =========================== */
function overviewKPIs(P, days, B = CTX.B) {
  const k = kOT(fOT(P, B)); const dis = DB.dis.filter(r => inPB(r, P, B)); const ordAll = sum(DB.ot.filter(r => inPB(r, P, B)), 'Order Count');
  k.perDay = div(k.net, days); k.perBranch = div(k.net, k.branches); k.discOrders = sum(dis, 'Orders Count'); k.discOrdPct = F.orderTypes.size ? NaN : div(k.discOrders, ordAll); k.avgDisc = div(sum(dis, 'Discount Amount'), k.discOrders);
  return k;
}

  const kp = [

    kcard({ l: 'Orders', v: fN(k.orders), def: 'orders', s: `${fN(k.guests)} guests`, d: dl(k.orders, kb?.orders) }),

    kcard({ l: 'Discounts', v: fC(k.disc), u: cur(), def: 'discount', s: `Rate ${fP(k.discRate, 2)}`, d: dl(k.discRate, kb?.discRate, { pp: 1, good: 'down' }) }),
    kcard({ l: 'Voids (report total)', v: fC(k.voidAmt), u: cur(), def: 'void_amount', s: `${fP(k.voidPct, 2)} of gross · ${fN(k.voidQty)} items`, d: dl(k.voidPct, kb?.voidPct, { pp: 1, good: 'down' }) }),
    kcard({ l: 'Returns (report total)', v: fC(k.retAmt), u: cur(), def: 'return_amount', s: `${fP(k.retPct, 2)} of gross · ${fN(k.retQty)} items`, d: dl(k.retPct, kb?.retPct, { pp: 1, good: 'down' }) }),
    kcard({ l: 'Net Sales / Calendar Day', v: fC(k.perDay), u: cur(), def: 'sales_per_day', s: `${CTX.days} calendar days`, d: dl(k.perDay, kb?.perDay) }),
    kcard({ l: 'Active Branches', v: fN(k.branches), def: 'active_branches', s: `of ${DB.branches.length} in backend` }),
    kcard({ l: 'Net Sales / Active Branch', v: fC(k.perBranch), u: cur(), def: 'sales_per_branch', s: 'Average across active branches', d: dl(k.perBranch, kb?.perBranch) }),
    kcard({ l: 'Discounted Orders (indicative)', v: F.orderTypes.size ? 'n/a' : fP(k.discOrdPct, 1), def: 'discount_orders_pct', s: F.orderTypes.size ? 'Discounts report has no Order Type' : `Avg discount ${fN(k.avgDisc, 0)} ${cur()} / order` }),
    kcard({ l: isNum(mom) ? 'Sales Growth (MoM)' : 'Sales Growth', v: isNum(mom) ? (mom >= 0 ? '+' : '') + fP(mom, 1) : 'n/a', def: 'mom', s: momNote }),

  const bk = branchKPIs(P, CTX.B).filter(x => x.orders > 0).sort((a, b) => b.net - a.net); const ref = netRef(P);

  // channel mix
  const ots = uniq(fOT(), r => r['Order Type']); const otCol = Object.fromEntries(ots.map((o, i) => [o, ['#2a2f3a', '#b8862f', '#3a5a86', '#b23b39', '#7b4fa3'][i % 5]]));
  const mixRows = bk.map(x => ({ key: x.ref, label: x.name, parts: Object.fromEntries(ots.map(o => [o, sum(fOT().filter(r => r['Branch Reference'] === x.ref && r['Order Type'] === o), 'Net Sales')])) }));
  // insights
  const ins = []; if (bk.length) {
    const t = bk[0]; ins.push(`<b>${esc(t.name)}</b> leads with ${fN(t.net)} ${cur()} net sales (${fP(div(t.net, k.net))} of the selection).`);

    const hd = [...bk].sort((a, b) => b.discRate - a.discRate)[0]; ins.push(`Highest discount rate: <b>${esc(hd.name)}</b> at ${fP(hd.discRate, 2)} vs all branches ${fP(ref.discRate, 2)} (${fX(hd.discRate / ref.discRate)}).`);

}

  const cols = [
    { t: 'Branch', get: r => r.name, f: (v, r) => `<a href="#" data-act="focus" data-key="${r.ref}" style="color:inherit;font-weight:600"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${bColor(r.ref)};margin-right:6px"></i>${esc(v)}</a>` },

  return table('health', cols, rows, { size: 0, csv: true, csvName: 'branch_health' });
}

function agg(rows, kf) { return [...groupBy(rows, kf)].map(([k, rr]) => ({ k, rr, lines: rr.length, qty: sum(rr, 'Quantity'), amt: sum(rr, 'Amount'), orders: new Set(rr.map(r => r._g)).size, selfP: div(rr.filter(r => r.self === 'Yes').length, rr.filter(r => r.self !== 'No Approver').length), wastedP: div(sum(rr.filter(r => r.wasted), 'Amount'), sum(rr, 'Amount')) })); }

  const dl = (c, b, o = {}) => baseR ? (baseR.ok ? deltaHTML(c, b, { ...o, label: baseR.label, good: 'down' }) : '<span class="delta flat">n/a</span>') : '';
  const grp = (re) => sum(dis.filter(r => re.test(r.Group)), 'Discount Amount'); const review = sum(dis.filter(r => r.Note), 'Discount Amount');
  const filt = F.discGroups.size || F.discLabels.size;

    kcard({ l: 'Total Discount', v: fC(td), u: cur(), def: 'discount', s: filt ? 'Selected discount labels only' : 'Reconciles with Order Type report', d: dl(td, kb?.d) }),
    kcard({ l: filt ? 'Rate (of Gross ex tax)' : 'Discount Rate', v: fP(div(td, ko.grossEx), 2), def: 'discount_rate', s: `Gross ex tax ${fC(ko.grossEx)}`, d: dl(div(td, ko.grossEx), kb ? div(kb.d, kb.ko.grossEx) : NaN, { pp: 1 }) }),
    kcard({ l: 'Discounted Orders (indicative)', v: fN(ordD), def: 'discount_orders_pct', s: `${fP(div(ordD, ko.orders), 0)} of ${fN(ko.orders)} orders · may double count` }),
    kcard({ l: 'Avg Discount / Discounted Order', v: fN(div(td, ordD), 0), u: cur(), def: 'avg_discount', s: 'Indicative' }),
    kcard({ l: 'Internal Share', v: fP(div(grp(/^Internal/), td), 0), def: 'internal_share', s: 'Staff / Officer / Owner labels' }),

  const bk = branchKPIs(P, CTX.B, false); const bdRows = DB.branches.filter(b => CTX.B.has(b.ref)).map(b => { const dd = dis.filter(r => r['Branch Reference'] === b.ref), kk = bk.find(x => x.ref === b.ref) || {}; const amt = sum(dd, 'Discount Amount'); return { ref: b.ref, name: b.name, amt, rate: div(amt, kk.grossEx), orders: sum(dd, 'Orders Count'), ordPct: div(sum(dd, 'Orders Count'), kk.orders), avg: div(amt, sum(dd, 'Orders Count')), net: kk.net, internal: div(sum(dd.filter(r => /^Internal/.test(r.Group)), 'Discount Amount'), amt), open: div(sum(dd.filter(r => /^Open/.test(r.Group)), 'Discount Amount'), amt) }; });
  const mult = +DB.settings['Review Multiple - Discount Rate'], nref = div(td, ko.grossEx);
  const rankItems = [...bdRows].sort((a, b) => b.rate - a.rate).map(r => ({ key: r.ref, label: r.name, value: r.rate, color: rateFlag(r.rate, nref, mult) ? FLAGRED : bColor(r.ref), sub: fX(r.rate / nref), tip: TIP(r.name, [['Discount rate', fP(r.rate, 2)], ['Discount', fN(r.amt)], ['× selection rate', fX(r.rate / nref)]]) }));
  const cb = [{ t: 'Rank', num: 1, get: r => r.rk }, { t: 'Branch', get: r => r.name }, { t: 'Discount', num: 1, get: r => r.amt, f: v => fN(v) }, { t: 'Rate', num: 1, get: r => r.rate, f: v => fP(v, 2) }, { t: 'Orders (ind.)', num: 1, get: r => r.orders, f: v => fN(v) }, { t: '% Orders (ind.)', num: 1, get: r => r.ordPct, f: v => fP(v, 0) }, { t: 'Avg / Order', num: 1, get: r => r.avg, f: v => fN(v, 0) }, { t: 'Internal %', num: 1, get: r => r.internal, f: v => fP(v, 0) }, { t: 'Open %', num: 1, get: r => r.open, f: v => fP(v, 0) }];
  const ranked = [...bdRows].sort((a, b) => b.rate - a.rate).map((r, i) => ({ ...r, rk: i + 1 }));
  // by group stacked by branch

  const gc = Object.fromEntries(groups.map((g, i) => [g, gcol[i % gcol.length]]));
  const labChart = hbar(lab.slice(0, 15).map(x => ({ label: x.l, value: x.amt, color: gc[x.grp], sub: fP(div(x.amt, td), 0), tip: TIP(x.l, [['Value', fN(x.amt)], ['Orders (ind.)', x.ord], ['Group', x.grp], ['Branches', x.br], ...(x.note ? [['Review note', x.note]] : [])]) })), { fmt: fC });
  const legend = `<div class="legend">${groups.map(g => `<span><i style="background:${gc[g]}"></i>${esc(g)}</span>`).join('')}</div>`;
  // by order type (OT)

  // correlation
  const xs = bdRows.map(r => r.net), ys = bdRows.map(r => r.rate); let rr_ = NaN; if (xs.length >= 3) { const mx = sum(xs, v => v) / xs.length, my = sum(ys, v => v) / ys.length; const num = sum(xs.map((x, i) => (x - mx) * (ys[i] - my)), v => v), den = Math.sqrt(sum(xs, x => (x - mx) ** 2) * sum(ys, y => (y - my) ** 2)); rr_ = num / den; }
  // lines table

  return `${pageHead('Discounts Analysis', 'Discount value, rate and composition by branch, label and channel. No approved discount limits exist in the source files, so none are assumed; signals compare branches with all branches combined only.')}

  <div class="grid kpis">${kp}</div>
  <div class="grid g2">
    <div class="card span2">${cardHead('Discount Rate by Branch (ranked)', `Discount ÷ gross sales ex tax. Red = at or above ${mult}× the rate of the selection (analyst review multiple). Click a bar to drill into a branch.`, ['dis'])}${hbar(rankItems, { fmt: v => fP(v, 2), ref: nref, refLabel: 'selection', act: 'branch' })}${table('dbranch', cb, ranked, { size: 0, csvName: 'discount_by_branch' })}</div>
    <div class="card">${cardHead('Discount Composition by Branch', 'Groups are a proposed mapping (Map_Discount).', ['dis'])}${stackH(gRows, groups.map(g => ({ k: g, label: g, color: gc[g] })), { pct: true, act: 'branch' })}</div>

function pgCategory() {

  let cum = 0; cs.forEach(x => { x.share = div(x.net, kc.net); cum += x.share; x.cum = cum; x.price = div(x.net, x.qty); x.dr = div(x.disc, x.grossEx); });

  const items = cs.slice(0, 15).map((x, i) => ({ key: x.c, label: x.c, value: x.net, color: '#b8862f', sub: fP(x.share, 1), tip: TIP(x.c, [['Net Sales', fN(x.net)], ['Share', fP(x.share)], ['Cumulative', fP(x.cum)], ['Items', fN(x.qty)], ['Discount rate', fP(x.dr, 2)]]) }));

function chipList() {

function renderChips() {

  $('#chips').innerHTML = `<span class="chip static"><b>Showing:</b> ${esc(SEL_PERIOD_LABEL())}</span>` + c.map((x, i) => `<span class="chip"><b>${esc(x.label)}:</b> ${esc(x.val)}<button title="Remove" data-act="rm" data-f="${x.key}" data-v="${esc(x.v)}">×</button></span>`).join('') + (base ? `<span class="chip static" style="${base.ok ? '' : 'background:#FFF3E0'}"><b>Compare:</b> ${esc(base.label)}</span>` : '') + (c.length ? '' : '<span style="color:var(--muted);font-size:12px">No extra filters</span>');
}
function onFilterChange(drill) { if (!DB) return; Object.values(MSREG).forEach(m => document.body.contains(m.el) && m.el.refresh()); updateCompare(); renderPage(); }
function updateCompare() {
  const sel = $('#cmp'); if (!sel || !DB) return; const P = [...selPeriods()]; const prevOk = P.length && P.every(p => DB.periods.includes(shiftPeriod(p, -1))), yoyOk = P.length && P.every(p => DB.periods.includes(shiftPeriod(p, -12)));
  const opts = [['none', 'No comparison', true], ['prev', 'vs previous month', prevOk], ['yoy', 'vs same month last year', yoyOk], ...DB.periods.map(p => ['p:' + p, 'vs ' + periodLabel(p), !P.includes(p) || P.length > 1])];
  const cur_ = F.compare.mode === 'custom' ? 'p:' + F.compare.period : F.compare.mode;
  sel.innerHTML = opts.map(([v, l, ok]) => `<option value="${v}" ${v === cur_ ? 'selected' : ''} ${ok ? '' : 'disabled'}>${l}${ok ? '' : ' (not available)'}</option>`).join('');
}
function applyDefaults() {

  F.ev = newEv(); F.compare = { mode: 'none', period: '' };
  if (DB.periods.length > 1) { const l = DB.periods[DB.periods.length - 1]; F.years = new Set([periodYear(l)]); F.months = new Set([periodM(l)]); }
  UI.focus = null;
}
function clearAll() { for (const k of ['years', 'quarters', 'months', 'branches', 'orderTypes', 'categories', 'payMethods', 'payGroups', 'discGroups', 'discLabels']) F[k] = new Set(); F.ev = newEv(); F.compare = { mode: 'none', period: '' }; onFilterChange(); }
function buildTop() {
  $('#gfilters').innerHTML = ['years', 'quarters', 'months', 'branches'].map(k => `<span data-mount="${k}" data-right="${k === 'branches' ? 1 : 0}"></span>`).join('') + `<label class="cmpbox"><span class="mini" style="display:block;font-weight:700">Compare</span><select class="sel" id="cmp"></select></label>`;
  mountFilters($('#gfilters')); Object.keys(MSREG).forEach(id => { MSREG[id].el.dataset.global = '1'; });
  $('#cmp').addEventListener('change', e => { const v = e.target.value; F.compare = v === 'none' || v === 'prev' || v === 'yoy' ? { mode: v, period: '' } : { mode: 'custom', period: v.slice(2) }; renderPage(); });
  updateCompare();

function goto(id) { UI.page = id; history.replaceState(null, '', '#' + id); renderPage(); window.scrollTo(0, 0); }

/* ---- splash / loading ---- */
function renderSplash() {
  $('#sub').textContent = 'No data loaded'; $('#chips').innerHTML = ''; renderNav();
  $('#content').innerHTML = `<div class="splash"><h2 style="font-size:26px">Load the Analytics Backend</h2><p style="color:var(--muted)">This dashboard shows only what is in your Backend workbook - it contains no built-in numbers.</p>
  <div class="drop" id="drop"><h2>Country_Hills_Analytics_Backend.xlsx</h2><p style="color:var(--muted)">Drag the file here, or</p><button class="btn pri" data-act="load" style="font-size:15px;padding:10px 20px">Choose file…</button></div>
  <ol class="steps"><li>Update the Backend each month with <code>country_hills_backend.py add-month</code> (see README).</li><li>Open this page and load the updated file. The browser keeps the last file you loaded, so you only re-select it after an update.</li><li>Everything runs locally in your browser: no upload, no server, no internet needed.</li></ol></div>`;
  const d = $('#drop'); ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); })); ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
}
function showLoadErrors(res, name) { modal(`<h3>Could not load "${esc(name)}"</h3><p>The file does not match the Backend structure the dashboard expects:</p><ul>${res.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>${res.warnings.length ? `<p>Warnings:</p><ul>${res.warnings.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}<p style="color:var(--muted)">Use the file produced by <code>country_hills_backend.py</code> and do not rename sheets or required columns. ${DB ? 'The previously loaded data is still shown.' : ''}</p>`); }
function snapshotFilters() { const c = s => new Set(s); const o = {}; for (const k of ['years', 'quarters', 'months', 'branches', 'orderTypes', 'categories', 'payMethods', 'payGroups', 'discGroups', 'discLabels']) o[k] = c(F[k]); o.compare = { ...F.compare }; o.focus = UI.focus; return o; }
function adopt(res, name, meta, info) {
  const keep = meta.keep ? snapshotFilters() : null;
  DB = res; applyDefaults();
  if (keep) { for (const k of Object.keys(keep)) { if (k === 'compare') F.compare = keep.compare; else if (k === 'focus') UI.focus = keep.focus; else F[k] = new Set([...keep[k]]); } }
  buildTop(); const h = (location.hash || '').slice(1); if (PAGES.some(p => p.id === h)) UI.page = h; if (!PAGES.some(p => p.id === UI.page)) UI.page = 'overview'; renderPage();
  const cnt = `${DB.periods.length} period${DB.periods.length > 1 ? 's' : ''} (${DB.periods.map(periodLabel).join(', ')}), ${DB.branches.length} branches, ${DB.vr.length} void/return lines`;
  toast((meta.source === 'cache' ? 'Loaded the copy saved in this browser: ' : meta.source === 'gsheet' ? (meta.keep ? 'Auto-refreshed from Google Sheet: ' : 'Updated from Google Sheet: ') : 'Loaded ') + name + ' - ' + cnt + (DB.warnings.length ? '. Warnings: ' + DB.warnings.slice(0, 3).join(' ') : '.'), false, 6500);
}
async function loadBuffer(buf, name, meta = {}) {
  try {
    const wb = await XLSXLite.read(buf); const info = { size: buf.byteLength, loadedAt: new Date().toLocaleString('en-GB'), source: meta.source || 'file' };
    const res = buildDB(wb, name, info); if (res.errors) { showLoadErrors(res, name); return false; }
    adopt(res, name, meta, info);
    if (meta.source !== 'cache') idbPut('last', { name, buf, savedAt: Date.now() }).catch(() => { });
    return true;
  } catch (e) { console.error(e); modal(`<h3>Could not read the file</h3><p>${esc(e.message)}</p><p style="color:var(--muted)">Select the .xlsx Backend file (not the original .xls reports).</p>`); return false; }
}

/* ===================== GOOGLE SHEET LINK (manual button + optional auto-refresh) ===================== */
const GS = { key: 'ch_gsheet_v1', timer: null, busy: false, every: 15 * 60 * 1000 };
const GS_SHEETS = ['Sales_OrderType', 'Sales_Category', 'Discounts', 'Payments', 'Voids_Returns', 'Period_Info', 'Dim_Branch', 'Map_Payment', 'Map_Discount', 'Settings'];
const gsCfg = () => { try { return JSON.parse(localStorage.getItem(GS.key) || '{}'); } catch (_) { return {}; } };
const gsSave = o => { try { localStorage.setItem(GS.key, JSON.stringify({ ...gsCfg(), ...o })); } catch (_) { } };
const gsId = u => { u = (u || '').trim(); const m = /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/.exec(u) || /^([a-zA-Z0-9_-]{25,})$/.exec(u); return m ? m[1] : null; };
function parseCSV(t) { const rows = []; let r = [], f = '', q = false; for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; } else if (c === '"') q = true; else if (c === ',') { r.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; } else f += c; } if (f !== '' || r.length) { r.push(f); rows.push(r); } return rows; }
async function gsFetchSheet(id, name) {
  const u = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(`Google returned HTTP ${r.status} for sheet "${name}".`);
  const t = await r.text(); if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('Google returned a sign-in page. Share the sheet as "Anyone with the link - Viewer".');
  return parseCSV(t);
}
function gsStatus(msg, cls) { const el = $('#gsStatus'); if (el) { el.textContent = msg; el.style.color = cls === 'err' ? 'var(--bad)' : cls === 'ok' ? 'var(--good)' : 'var(--muted)'; } }
async function gsLoad(background) {
  if (GS.busy) return; const inp = $('#gsUrl'); const url = inp ? inp.value.trim() : gsCfg().url; const id = gsId(url);
  if (!id) { gsStatus('Paste a Google Sheet link first.', 'err'); if (!background) toast('Paste a valid Google Sheet link (docs.google.com/spreadsheets/d/…).', true); return; }
  GS.busy = true; gsStatus('Updating from Google Sheet…'); const btn = $('#gsBtn'); if (btn) btn.disabled = true;
  try {
    const grids = await Promise.all(GS_SHEETS.map(n => gsFetchSheet(id, n).then(g => [n, g])));
    const wb = { sheets: Object.fromEntries(grids), order: GS_SHEETS }; const info = { size: 0, loadedAt: new Date().toLocaleString('en-GB'), source: 'gsheet' };
    const res = buildDB(wb, 'Google Sheet', info); if (res.errors) { if (background) throw new Error(res.errors[0]); showLoadErrors(res, 'Google Sheet'); gsStatus('Sheet structure does not match the Backend.', 'err'); return; }
    const st = XLSXLite.toObjects(wb.sheets.Settings || []).rows; if (st.some(r => r.Setting && (r.Value === '' || r.Value == null))) res.warnings.push('Some Settings values were empty in the Google Sheet (Google CSV limitation with mixed text/number columns); defaults were used for them.');
    adopt(res, 'Google Sheet', { source: 'gsheet', keep: !!DB }, info); gsSave({ url, lastOk: Date.now() });
    gsStatus('Last update: ' + new Date().toLocaleTimeString('en-GB') + (gsCfg().auto ? ' · auto-refresh every 15 min' : ''), 'ok');
  } catch (e) {
    console.error(e); const msg = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Could not reach Google Sheets (no internet, or the browser blocked the request). The data already loaded is unchanged.' : e.message;
    gsStatus(msg, 'err'); if (!background) toast(msg, true, 8000);
  } finally { GS.busy = false; if (btn) btn.disabled = false; }
}
function gsAuto(on) { gsSave({ auto: on }); clearInterval(GS.timer); GS.timer = null; if (on) { GS.timer = setInterval(() => gsLoad(true), GS.every); gsStatus('Auto-refresh on: every 15 minutes while this page is open.'); } else gsStatus('Auto-refresh off.'); }
function gsInit() {
  const c = gsCfg(), inp = $('#gsUrl'); if (inp && c.url) inp.value = c.url; const chk = $('#gsAuto'); if (chk) chk.checked = !!c.auto;
  if (c.auto && c.url) { gsAuto(true); }
}
async function readFile(f) { if (!/\.xls[xm]$/i.test(f.name)) { modal(`<h3>Wrong file type</h3><p>"${esc(f.name)}" is not an .xlsx workbook. Load <b>Country_Hills_Analytics_Backend.xlsx</b>. The original .xls POS reports are loaded into the Backend with the helper script, not into the dashboard.</p>`); return; } await loadBuffer(await f.arrayBuffer(), f.name); }
/* last-file cache (IndexedDB, local to this browser) */
const idbOpen = () => new Promise((res, rej) => { const r = indexedDB.open('country_hills_dashboard', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbPut = async (k, v) => { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbGet = async k => { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('files').objectStore('files').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };

/* ---- global events ---- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act, key = a.dataset.key;
  if (act !== 'csv' && a.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'load': $('#file').click(); break;
    case 'gsLoad': gsLoad(false); break;
    case 'goto': if (a.dataset.branch) { F.branches = new Set([a.dataset.branch]); onFilterChange(); } goto(key); break;
    case 'branch': toggleBranch(key); break;
    case 'focus': UI.focus = key; if (UI.page !== 'branches') { goto('branches'); } else renderPage(); break;
    case 'cat': F.categories = (F.categories.size === 1 && F.categories.has(key)) ? new Set() : new Set([key]); onFilterChange(); break;
    case 'tx': if (key) F.branches = new Set([key]); if (a.dataset.type) F.ev.types = new Set([a.dataset.type]); if (a.dataset.flag) F.ev.flag = a.dataset.flag; onFilterChange(); goto('transactions'); break;
    case 'order': showOrder(key); break;
    case 'csv': tableCSV(a.dataset.id); break;
    case 'closeModal': $$('.modal-bg').forEach(x => x.remove()); break;
    case 'rm': { const f = a.dataset.f, v = a.dataset.v; if (f.startsWith('ev.')) { const p = f.slice(3); if (F.ev[p] instanceof Set) { const s = new Set(F.ev[p]); s.delete(v); F.ev[p] = s; } else F.ev[p] = ''; } else { const s = new Set(F[f]); s.delete(v); F[f] = s; } onFilterChange(); break; }

    case 'reset': applyDefaults(); onFilterChange(); break;

document.addEventListener('change', e => {

  const s = e.target.closest('[data-sel]'); if (s) { const k = s.dataset.sel; UI[k] = k === 'dqCheck' ? +s.value : s.value; renderPage(); return; }
  const v = e.target.closest('[data-ev]'); if (v && v.type !== 'search' && v.type !== 'number') { F.ev[v.dataset.ev] = v.value; onFilterChange(); }
});
let evT; document.addEventListener('input', e => { const v = e.target.closest('[data-ev]'); if (v && (v.type === 'search' || v.type === 'number')) { clearTimeout(evT); const pos = v.selectionStart, f = v.dataset.ev; evT = setTimeout(() => { F.ev[f] = v.value; onFilterChange(); const n = $(`[data-ev="${f}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { } } }, 260); } });

async function boot() {
  renderNav(); $('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; });
  document.addEventListener('dragover', e => e.preventDefault()); document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && !$('#drop')) readFile(f); });
  gsInit(); renderSplash();
  if (/^https?:$/.test(location.protocol)) { try { const r = await fetch('Country_Hills_Analytics_Backend.xlsx', { cache: 'no-store' }); if (r.ok) { await loadBuffer(await r.arrayBuffer(), 'Country_Hills_Analytics_Backend.xlsx', { source: 'server' }); return; } } catch (_) { } }
  try { const last = await idbGet('last'); if (last && last.buf) { await loadBuffer(last.buf, last.name, { source: 'cache' }); } } catch (_) { }
  const c = gsCfg(); if (c.auto && c.url) gsLoad(!!DB);
}

boot();
